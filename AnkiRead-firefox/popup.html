<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ReadAnki</title>
  <style>
    body { width: min(300px, 100vw); box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; padding: 14px; margin: 0; color: #1e293b; background: #ffffff; }
    h3 { margin: 0 0 8px 0; font-size: 15px; color: #1e3a8a; display: flex; align-items: center; gap: 6px; font-weight: 700; }
    p { font-size: 12px; color: #64748b; margin: 0 0 12px 0; line-height: 1.5; }
    .btn { width: 100%; padding: 9px; background: #2563eb; color: #fff; border: none; border-radius: 7px; font-weight: 600; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { margin-top: 8px; color: #1d4ed8; background: #eff6ff; border: 1px solid #bfdbfe; }
    .btn-secondary:hover { background: #dbeafe; }
    .link-row { margin-top: 10px; text-align: center; }
    .link-row a { font-size: 11px; color: #2563eb; text-decoration: underline; cursor: pointer; }
    .status-msg { font-size: 11px; color: #475569; margin-top: 6px; min-height: 0; }
    .status-msg:empty { display: none; }
    .status { margin-top: 12px; font-size: 11px; padding: 8px 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; color: #475569; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <h3><span>📘</span> ReadAnki 拡張機能</h3>
  <p>「このページで有効化」を押すと、そのタブでだけ英文選択時に三点リーダー(⋯)が出現し、文法解説・発音ができます。パソコンでは、英文を選択して右クリック →「ReadAnki: 文法解説」でも使えます。よく読むサイトは「常に有効にする」で登録できます。</p>
  <p>コツ①:すぐに解析しないこと。一回は必ず考える。</p>
  <p>コツ②:わかったら、目をつぶって空で言ってみる。</p>
  <p>コツ③:★を付けた単語は、履歴画面の「未知語テスト」で定期的に復習する。</p>
  <button class="btn" id="activate-tab">✨ このページで有効化</button>
  <div id="activate-msg" class="status-msg" role="status"></div>
  <button class="btn btn-secondary" id="always-enable">📌 このサイトを常に有効にする</button>
  <button class="btn btn-secondary" id="open-settings">⚙️ 拡張機能の設定を開く</button>
  <button class="btn btn-secondary" id="open-history">🕘 解析履歴を開く</button>
  <div class="link-row">
    <a id="open-settings-tab" href="options.html" target="_blank">新しいタブで設定ページを開く</a>
  </div>
  <div class="status">
    <span>ページへのアクセス:</span>
    <span style="font-weight: 600;">有効化したタブ・登録サイトのみ</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
